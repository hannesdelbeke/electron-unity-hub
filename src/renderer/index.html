<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unity Launcher</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-root">
    <header class="window-bar"></header>

    <main class="workspace">
      <aside class="sidebar">
        <div class="sidebar-brand">
          <img class="sidebar-brand-icon" src="./assets/unityhub.png" alt="Unity Hub" />
          <span class="sidebar-brand-title">Hub</span>
        </div>
        <button id="tab-projects" class="side-tab active">
          <span class="tab-icon">PR</span>
          <span class="tab-label">Projects</span>
        </button>
        <button id="tab-installs" class="side-tab">
          <span class="tab-icon">UI</span>
          <span class="tab-label">Installs</span>
        </button>
        <div class="side-spacer"></div>
        <button id="tab-settings" class="side-tab">
          <span class="tab-icon">ST</span>
          <span class="tab-label">Settings</span>
        </button>
      </aside>

      <section class="panel-host">
        <section id="view-projects" class="view active">
          <section id="topbar-projects" class="toolbar panel-topbar">
          <h1>Projects</h1>
          <input id="search" type="search" placeholder="Search projects" />
          <div class="add-wrap">
            <button id="add-toggle" class="btn">Add</button>
            <div id="add-menu" class="menu hidden">
              <button id="add-disk" class="menu-item">Add from disk</button>
              <button id="add-repo" class="menu-item">Add from repo</button>
            </div>
          </div>
          <button id="new-project" class="btn accent">New Project</button>
          <button id="refresh-btn" class="icon-btn topbar-refresh-btn" type="button" aria-label="Refresh projects" title="Refresh projects">↻</button>
        </section>

        <section class="projects-panel">
          <table id="projects-table">
            <thead>
              <tr>
                <th class="sortable" data-sort="displayName" data-label="Project">Project</th>
                <th class="sortable" data-sort="path" data-label="Path">Path</th>
                <th class="sortable" data-sort="unityVersion" data-label="Editor Version">Editor Version</th>
                <th class="sortable" data-sort="vcs" data-label="Source Control">Source Control</th>
                <th class="sortable" data-sort="branchOrStream" data-label="Branch / Stream">Branch / Stream</th>
                <th class="sortable" data-sort="lastOpenedIso" data-label="Modified">Modified</th>
                <th class="sortable" data-sort="status" data-label="Status">Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </section>

        <section class="footer-actions">
          <span id="status">Ready</span>
        </section>
      </section>

      <section id="view-installs" class="view">
        <section id="topbar-installs" class="toolbar panel-topbar">
          <h1>Installs</h1>
          <input id="search-installs" type="search" placeholder="Search installs" />
          <div class="add-wrap">
            <button id="add-toggle-installs" class="btn">Add</button>
            <div id="add-menu-installs" class="menu hidden">
              <button id="add-install-disk" class="menu-item">Add executable</button>
            </div>
          </div>
          <button id="refresh-installs" class="icon-btn topbar-refresh-btn" type="button" aria-label="Refresh installs" title="Refresh installs">↻</button>
        </section>

        <section class="projects-panel">
          <table id="installs-table">
            <thead>
              <tr>
                <th class="sortable" data-sort="version" data-label="Version">Version</th>
                <th class="sortable" data-sort="path" data-label="Path">Path</th>
                <th class="sortable" data-sort="source" data-label="Source">Source</th>
                <th class="sortable" data-sort="status" data-label="Status">Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </section>

        <section class="footer-actions installs-footer">
          <span class="muted">Click an install row to launch that editor.</span>
        </section>
      </section>

      <section id="view-settings" class="view">
        <section id="topbar-settings" class="toolbar panel-topbar">
          <h1>Settings</h1>
          <div class="topbar-spacer"></div>
        </section>
        <section class="settings-panel">
          <div class="settings-row">
            <label for="settings-default-unity-exe">Default Unity executable</label>
            <div class="input-row">
              <input id="settings-default-unity-exe" type="text" placeholder="Optional" />
              <button id="settings-browse-exe" type="button" class="btn">Browse</button>
            </div>
          </div>

          <div class="settings-row">
            <label for="settings-theme">Theme</label>
            <select id="settings-theme" class="theme-select">
              <option value="system">Match System</option>
              <option value="dark">Dark</option>
              <option value="light">Light</option>
            </select>
          </div>

          <div class="settings-row">
            <label for="settings-disable-render-throttling">Render throttling</label>
            <label class="checkbox-row" for="settings-disable-render-throttling">
              <input id="settings-disable-render-throttling" type="checkbox" />
              <span>Disable (smoother resize, higher CPU usage)</span>
            </label>
          </div>

          <div class="settings-actions">
            <button id="settings-save" class="btn accent">Save Settings</button>
            <button id="settings-remove-missing" class="btn danger">Remove Missing Projects</button>
          </div>
        </section>

        <section class="footer-actions installs-footer">
          <span class="muted">Theme changes apply immediately after saving.</span>
        </section>
      </section>
      </section>
    </main>
  </div>

  <dialog id="disk-dialog" class="modal">
    <form method="dialog" id="disk-form" class="modal-form">
      <h2>Add from disk</h2>
      <label>Project folder
        <div class="input-row">
          <input id="disk-path" type="text" />
          <button id="disk-browse-path" type="button" class="btn">Browse</button>
        </div>
      </label>
      <label>Nickname
        <input id="disk-nickname" type="text" placeholder="Optional" />
      </label>
      <label>Unity executable
        <div class="input-row">
          <input id="disk-unity-exe" type="text" placeholder="Optional" />
          <button id="disk-browse-exe" type="button" class="btn">Browse</button>
        </div>
      </label>
      <menu>
        <button value="cancel" type="button" class="btn" onclick="this.closest('dialog')?.close()">Cancel</button>
        <button id="disk-save" value="default" type="button" class="btn accent">Add project</button>
      </menu>
    </form>
  </dialog>

  <dialog id="repo-dialog" class="modal">
    <form method="dialog" id="repo-form" class="modal-form">
      <h2>Add from repo</h2>
      <label>Repository URL
        <input id="repo-url" type="text" />
      </label>
      <label>Branch (optional)
        <input id="repo-branch" type="text" />
      </label>
      <label>Clone to folder
        <div class="input-row">
          <input id="repo-target" type="text" />
          <button id="repo-browse-target" type="button" class="btn">Browse</button>
        </div>
      </label>
      <label>Nickname
        <input id="repo-nickname" type="text" placeholder="Optional" />
      </label>
      <label>Unity executable
        <div class="input-row">
          <input id="repo-unity-exe" type="text" placeholder="Optional" />
          <button id="repo-browse-exe" type="button" class="btn">Browse</button>
        </div>
      </label>
      <menu>
        <button value="cancel" type="button" class="btn" onclick="this.closest('dialog')?.close()">Cancel</button>
        <button id="repo-save" value="default" type="button" class="btn accent">Clone and add</button>
      </menu>
    </form>
  </dialog>

  <dialog id="project-settings-dialog" class="modal">
    <form method="dialog" id="project-settings-form" class="modal-form">
      <h2>Project Settings</h2>
      <label>Nickname
        <input id="project-settings-nickname" type="text" placeholder="Optional" />
      </label>
      <menu>
        <button value="cancel" type="button" class="btn" onclick="this.closest('dialog')?.close()">Cancel</button>
        <button id="project-settings-save" value="default" type="button" class="btn accent">Save</button>
      </menu>
    </form>
  </dialog>

  <script src="./renderer.js"></script>
</body>
</html>
