<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Electron Unity Hub Demo</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <section class="preview-banner">
    <div class="preview-scroll">
      <figure class="preview-frame">
        <img class="preview-image" src="./launcher-preview.png" alt="Launcher dark mode preview" />
      </figure>
    </div>
  </section>

  <section class="demo-scroll">
  <main class="shell">
    <aside class="sidebar">
      <button id="tab-projects" class="side-tab active">
        <span class="tab-icon">PR</span>
        <span class="tab-label">Projects</span>
      </button>
      <button id="tab-installs" class="side-tab">
        <span class="tab-icon">UI</span>
        <span class="tab-label">Installs</span>
      </button>
      <div class="side-spacer"></div>
      <button id="tab-settings" class="side-tab">
        <span class="tab-icon">ST</span>
        <span class="tab-label">Settings</span>
      </button>
    </aside>

    <section class="content">
      <section id="view-projects" class="view active">
        <section class="toolbar">
          <h1>Projects <span class="badge">Demo</span></h1>
          <div class="projects-more-wrap">
            <button id="projects-more-toggle" class="icon-btn" aria-label="Project menu">...</button>
            <div id="projects-more-menu" class="menu hidden">
              <button id="projects-menu-settings" class="menu-item">Open settings</button>
              <button id="projects-menu-remove" class="menu-item">Remove selected project</button>
            </div>
          </div>
          <input id="search" type="search" placeholder="Search projects" />
          <div class="add-wrap">
            <button id="add-toggle" class="btn">Add</button>
            <div id="add-menu" class="menu hidden">
              <button id="add-disk" class="menu-item">Add from disk</button>
              <button id="add-repo" class="menu-item">Add from repo</button>
            </div>
          </div>
          <button id="new-project" class="btn accent">New Project</button>
        </section>

        <section class="projects-panel">
          <table id="projects-table">
            <thead>
              <tr>
                <th>Project</th>
                <th>Path</th>
                <th>Editor Version</th>
                <th>Source Control</th>
                <th>Modified / Last Opened</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </section>

        <section class="footer-actions">
          <button id="delete-btn" class="btn danger">Remove</button>
          <button id="refresh-btn" class="btn">Refresh</button>
          <span id="status">Demo mode with mock data</span>
        </section>
      </section>

      <section id="view-installs" class="view">
        <section class="toolbar installs-toolbar">
          <h1>Installs <span class="badge">Demo</span></h1>
          <button id="refresh-installs" class="btn">Refresh Installs</button>
        </section>

        <section class="projects-panel">
          <table id="installs-table">
            <thead>
              <tr>
                <th>Version</th>
                <th>Path</th>
                <th>Source</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </section>

        <section class="footer-actions installs-footer">
          <span class="muted">Click an install row to launch that editor (mock).</span>
        </section>
      </section>

      <section id="view-settings" class="view">
        <section class="toolbar installs-toolbar">
          <h1>Settings <span class="badge">Demo</span></h1>
        </section>

        <section class="settings-panel">
          <label>Default Unity executable
            <input id="settings-default-unity-exe" type="text" placeholder="Optional" />
          </label>
          <label>Theme
            <select id="settings-theme" class="theme-select">
              <option value="system">Match System</option>
              <option value="dark">Dark</option>
              <option value="light">Light</option>
            </select>
          </label>
          <div class="settings-actions">
            <button id="settings-save" class="btn accent">Save Settings</button>
            <button id="settings-remove-missing" class="btn danger">Remove Missing Projects</button>
          </div>
        </section>

        <section class="footer-actions installs-footer">
          <span class="muted">Theme changes apply immediately after saving.</span>
        </section>
      </section>
    </section>
  </main>
  </section>

  <dialog id="disk-dialog" class="modal">
    <form method="dialog" id="disk-form" class="modal-form">
      <h2>Add from disk</h2>
      <label>Project folder
        <input id="disk-path" type="text" placeholder="D:/repos/my-game" />
      </label>
      <label>Nickname
        <input id="disk-nickname" type="text" placeholder="Optional" />
      </label>
      <menu>
        <button type="button" class="btn" onclick="this.closest('dialog')?.close()">Cancel</button>
        <button id="disk-save" type="button" class="btn accent">Add project</button>
      </menu>
    </form>
  </dialog>

  <dialog id="repo-dialog" class="modal">
    <form method="dialog" id="repo-form" class="modal-form">
      <h2>Add from repo</h2>
      <label>Repository URL
        <input id="repo-url" type="text" placeholder="git@github.com:org/repo.git" />
      </label>
      <label>Branch (optional)
        <input id="repo-branch" type="text" placeholder="feature/branch" />
      </label>
      <label>Clone to folder
        <input id="repo-target" type="text" placeholder="D:/repos/project" />
      </label>
      <label>Nickname
        <input id="repo-nickname" type="text" placeholder="Optional" />
      </label>
      <menu>
        <button type="button" class="btn" onclick="this.closest('dialog')?.close()">Cancel</button>
        <button id="repo-save" type="button" class="btn accent">Clone and add</button>
      </menu>
    </form>
  </dialog>

  <script src="./demo.js"></script>
</body>
</html>
